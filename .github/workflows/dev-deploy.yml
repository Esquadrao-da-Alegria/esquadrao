name: 🚀 Deploy website on DEV

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  deploy:
    name: 🔥 Deploy completo no servidor DEV
    runs-on: ubuntu-latest

    env:
      GH_DEPLOY_KEY: ${{ secrets.SSH_KEY_DEPLOY }}

    steps:
      - name: 🚚 Checkout do código
        uses: actions/checkout@v4

      - name: 🔑 Conectar via SSH e executar deploy completo
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY_DEPLOY }}
          port: ${{ secrets.SSH_PORT }}
          envs: GH_DEPLOY_KEY
          script_stop: true
          script: |
            set -e

            echo "📦 Iniciando deploy no servidor DEV..."
            cd ${{ secrets.APP_PATH_DEV }}

            echo "🔐 Configurando safe directory..."
            git config --global --add safe.directory ${{ secrets.APP_PATH_DEV }}

            echo "🔑 Configurando chave SSH para GitHub..."
            mkdir -p ~/.ssh
            echo "$GH_DEPLOY_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> ~/.ssh/known_hosts
            eval "$(ssh-agent -s)"
            ssh-add ~/.ssh/id_ed25519

            echo "📥 Atualizando branch dev..."
            git fetch origin dev
            git reset --hard origin/dev

            echo "📦 Instalando dependências PHP..."
            composer install --no-dev --optimize-autoloader --no-interaction

            echo "🟢 Instalando dependências JS (React/Vite)..."
            npm ci --production

            echo "🏗️ Gerando build do frontend..."
            npm run build

            echo "🧹 Otimizando Laravel..."
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "🗄️ Executando migrações..."
            php artisan migrate --force

            echo "🔗 Atualizando links e reiniciando filas..."
            php artisan storage:link
            php artisan queue:restart

            echo "🚀 Deploy finalizado com sucesso!"