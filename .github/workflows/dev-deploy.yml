name: 🚀 Deploy website on push

on:
  workflow_run:
    workflows: ["PHP Config (Laravel)"]
    types:
      - completed
jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v2
            
      - name: 📂 Sync files
        uses: SamKirkland/FTP-Deploy-Action@4.3.2
        with:
          server: ftp.bprates.com.br
          username: esq@dev.esquadraodaalegria.org.br
          password: ${{ secrets.FTP_PASSWORD_DEV }}