name: 🚀 Deploy website on DEV

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  deploy-code:
    name: 📥 Atualizar código no servidor
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout do código
        uses: actions/checkout@v4

      - name: 🔑 Atualizar repositório remoto via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "📦 Atualizando código no servidor DEV..."
            cd ~/dev.esquadroadalegria.org.br

            # Atualiza branch dev
            git fetch origin dev
            git reset --hard origin/dev

            echo "✅ Código atualizado com sucesso!"

  build-environment:
    name: 🏗️ Build do ambiente Laravel + React
    runs-on: ubuntu-latest
    needs: deploy-code  # garante que só roda após o deploy do código

    steps:
      - name: 🔑 Executar build e otimizações
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/dev.esquadroadalegria.org.br

            echo "📦 Instalando dependências PHP..."
            composer install --no-dev --optimize-autoloader --no-interaction

            echo "🟢 Instalando dependências do React/Vite..."
            npm ci --production

            echo "🏗️ Gerando build do frontend..."
            npm run build

            echo "🧹 Limpando e otimizando caches..."
            php artisan optimize:clear
            php artisan optimize

            echo "🗄️ Rodando migrações..."
            php artisan migrate --force

            echo "🔗 Atualizando links e reiniciando filas..."
            php artisan storage:link
            php artisan queue:restart

            echo "✅ Build e deploy DEV finalizado com sucesso!"