name: 🚀 Deploy website on DEV

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  web-deploy:
    name: 🎉 Deploy DEV
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🔑 Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "🚀 Iniciando deploy Laravel + React (DEV)..."

            # Caminho do projeto DEV
            cd ~/dev.esquadroadalegria.org.br

            echo "📥 Atualizando código..."
            git fetch origin
            git reset --hard origin/dev

            echo "📦 Instalando dependências PHP..."
            composer install --no-dev --optimize-autoloader --no-interaction

            echo "🟢 Instalando dependências do React/Vite..."
            npm ci --production

            echo "🏗️ Gerando build do frontend..."
            npm run build

            echo "🧹 Limpando e otimizando caches..."
            php artisan optimize:clear
            php artisan optimize

            echo "🗄️ Rodando migrações..."
            php artisan migrate --force

            echo "🗑️ Limpando arquivos antigos..."
            php artisan storage:link
            php artisan queue:restart

            echo "✅ Deploy DEV concluído com sucesso!"