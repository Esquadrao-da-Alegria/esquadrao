name: PHP Config (Laravel)

on:
  push:
    branches:
      - dev

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Get latest code
        uses: actions/checkout@v3

      - name: Setup PHP for Laravel
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, bcmath, pdo_mysql, tokenizer, ctype, xml, fileinfo, openssl, json
          ini-values: post_max_size=256M, upload_max_filesize=256M, max_execution_time=180, memory_limit=512M
          coverage: none