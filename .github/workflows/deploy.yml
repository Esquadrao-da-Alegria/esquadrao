name: 🚀 Deploy website on PROD

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Deploy estático para PROD via SSH
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout do código
        uses: actions/checkout@v4

      - name: 📤 Enviar arquivos via SSH (rsync)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "🚀 Iniciando deploy PROD..."

      - name: 🔁 Sincronizar arquivos com rsync
        uses: burnett01/rsync-deploy@v1.1
        with:
          switches: -avzr --delete
          path: prod/
          remote_path: /var/www/esquadraodaalegria/prod
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: ✅ Finalizado
        run: echo "Deploy de produção concluído!"