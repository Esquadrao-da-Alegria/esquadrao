name: 🚀 Deploy website on PROD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: 🔥 Deploy completo no servidor PROD
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout do código
        uses: actions/checkout@v4

      - name: 🔑 Conectar via SSH e executar deploy completo
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY_DEPLOY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            set -e
            export COMPOSER_ALLOW_SUPERUSER=1

            echo "📦 Iniciando deploy no servidor PROD..."
            cd ${{ secrets.APP_PATH_PRD }}

            echo "🔐 Configurando safe directory..."
            git config --global --add safe.directory ${{ secrets.APP_PATH_PRD }}

            echo "📥 Atualizando branch main..."
            git fetch origin main
            git reset --hard origin/main

            echo "📦 Instalando dependências PHP..."
            composer install --no-dev --optimize-autoloader --no-interaction

            echo "🧹 Limpando cache e otimizações..."
            php artisan optimize:clear

            echo "🔍 Gerando Rotas Wayfinder..."
            php artisan wayfinder:generate

            echo "🟢 Instalando dependências JS (React/Vite)..."
            npm ci

            echo "🔨 Compilando assets..."
            npm run build

            echo "🗄️ Executando migrações..."
            php artisan migrate --force

            echo "🔗 Atualizando storage e reiniciando filas..."
            php artisan storage:link
            php artisan queue:restart

            echo "🔍 Gerando cache de otimização..."
            php artisan optimize

            echo "🚀 Deploy PROD finalizado com sucesso!"